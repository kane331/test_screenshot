[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "web-test-archive"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["playwright>=1.48", "openpyxl>=3.1", "Pillow>=10", "filelock>=3.13"]
[project.scripts]
webarchive = "webarchive.app:main"
[tool.setuptools.packages.find]
include = ["webarchive*"]
